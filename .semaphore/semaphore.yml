version: v1.0
name: Pipeline
agent:
  machine:
    type: e2-standard-4
    os_image: ubuntu2404
fail_fast:
  cancel:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch != 'main'
blocks:
  - name: Docker update latest image and push to GAR
    skip:
      when: branch != 'main'
    task:
      env_vars:
        - name: GAR_REGISTRY
          value: us-docker.pkg.dev/abyss-global/cudagl/cudagl
      secrets:
        - name: fabric-web-v2-gcp
        - name: sem-cli-access-token
        - name: infra-github-push-key
      prologue:
        commands:
          - checkout
          - gcloud auth activate-service-account --key-file=/home/semaphore/gcp-sa-key.json
          - gcloud auth configure-docker us-docker.pkg.dev --quiet
          - chmod 400 ~/.ssh/infra_github
      jobs:
        - name: update latest tag and push docker image to GAR
          commands:
            # Build the image
            - eval "$(ssh-agent -s)" && ssh-add ~/.ssh/infra_github
            - |
                ./build.sh \
                    --debug \
                    --image-name $GAR_REGISTRY \
                    --cuda-version 11.8.0-cudnn8 \
                    --os ubuntu \
                    --os-version 22.04 \
                    --arch x86_64 \
                    --cudagl \
                    --devel

            # Push tagged as latest
            - docker push $GAR_REGISTRY:11.8.0-cudnn8-devel-ubuntu22.04

            # Trigger the next image in the chain (devtools) to rebuild, via Semaphore's
            # "run workflow" API rather than inferring a workflow to rebuild from
            # `sem get workflows`, which can't distinguish differently-purposed workflows
            # sharing the same branch label. Explicitly naming pipeline_file sidesteps
            # that ambiguity entirely instead of detecting it after the fact.
            #
            # There's no Semaphore API/CLI endpoint to resolve a project name to its UUID,
            # so this is hardcoded (from the Semaphore dashboard's project URL).
            - |
                curl --fail --request POST "https://abyss.semaphoreci.com/api/v1alpha/plumber-workflows" \
                    --header "Authorization: Token ${ACCESS_TOKEN}" \
                    --header "Content-Type: application/json" \
                    --data '{"project_id": "ae6f5d08-3c52-42f0-b3ab-812839fc6730", "reference": "refs/heads/master", "pipeline_file": ".semaphore/semaphore.yml"}'
promotions:
  - name: Build, tag with commit hash, push to GAR
    pipeline_file: build_and_push.yml
    parameters:
      env_vars:
        - name: CUDA_VERSION
          required: true
          default_value: 11.8.0-cudnn8
          description: CUDA version string passed to build.sh --cuda-version (e.g. 11.8.0-cudnn8, 12.2.0)
        - name: OS
          required: true
          default_value: ubuntu
          description: Target OS passed to build.sh --os (e.g. ubuntu)
        - name: OS_VERSION
          required: true
          default_value: "22.04"
          description: Target OS version passed to build.sh --os-version (e.g. 22.04, 20.04)
        - name: ARCH
          required: true
          default_value: x86_64
          description: Target architecture passed to build.sh --arch (e.g. x86_64, arm64)
